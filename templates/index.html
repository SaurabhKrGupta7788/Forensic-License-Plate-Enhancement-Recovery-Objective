<!DOCTYPE html>
<html>
<head>
    <title>ANPR Flask App</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; }
        .container { max-width: 800px; margin: auto; }
        .section { margin-bottom: 40px; padding: 20px; border: 1px solid #ccc; border-radius: 5px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>License Plate Detection (Flask)</h1>
        
        <div class="section">
            <h2>Live Web Camera</h2>
            <img src="/video_feed" width="100%" style="border:1px solid black;" onerror="this.onerror=null; this.src=''; this.alt='Camera Stopped';" />
            <br><br>
            <form action="/stop_camera" method="get">
                <button type="submit">Stop Camera / Free Resource</button>
            </form>
        </div>
        
        <div class="section">
            <h2>Upload Image for Testing</h2>
            <form action="/upload" method="post" enctype="multipart/form-data">
                <input type="file" name="file" accept=".jpg,.jpeg,.png">
                <button type="submit">Process Image</button>
            </form>
        </div>
    </div>
</body>
</html>
